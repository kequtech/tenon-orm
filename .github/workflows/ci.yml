name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Node 24 / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenon_orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tenon_orm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TENON_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tenon_orm_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Use the server's own pg_dump without relying on the runner's client major.
      - name: Use matching PostgreSQL client
        run: |
          mkdir -p "$RUNNER_TEMP/tenon-bin"
          install -m 755 scripts/pg-dump-container.sh "$RUNNER_TEMP/tenon-bin/pg_dump"
          echo "$RUNNER_TEMP/tenon-bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Check types, PostgreSQL workflows and packed consumers
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: npm run check
      - run: npm pack --dry-run --ignore-scripts

  baseline-portability:
    name: Baseline PostgreSQL 18 → 16
    runs-on: ubuntu-latest
    services:
      target:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenon_orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tenon_orm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      source:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenon_orm_test
        options: >-
          --health-cmd "pg_isready -U postgres -d tenon_orm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TENON_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tenon_orm_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Connect the runner and native client to the same PostgreSQL 18 source
        env:
          POSTGRES_CONTAINER: ${{ job.services.source.id }}
        run: |
          source_host="$(docker inspect "$POSTGRES_CONTAINER" --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')"
          echo "TENON_BASELINE_SOURCE_DATABASE_URL=postgresql://postgres:postgres@$source_host:5432/tenon_orm_test" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tenon-bin"
          install -m 755 scripts/pg-dump-container.sh "$RUNNER_TEMP/tenon-bin/pg_dump"
          echo "$RUNNER_TEMP/tenon-bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Capture on PostgreSQL 18 and replay fresh on PostgreSQL 16
        env:
          POSTGRES_CONTAINER: ${{ job.services.source.id }}
        run: npm run test:baseline-portability
